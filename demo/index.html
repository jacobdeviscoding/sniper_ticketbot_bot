<!DOCTYPE html>

<html lang="zh-HK">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>TickPilot Arena</title>

    <link rel="stylesheet" href="styles.css" />

  </head>

  <body data-hkt-mirror="true">

    <header class="hkt-header">

      <div class="hkt-logo" id="mirror-brand">HK Ticketing <span>MIRROR</span></div>

      <div class="hkt-meta">

        <code id="mirror-host">hkt.hkticketing.com</code>

        <code id="mirror-hash">#/login</code>

      </div>

      <span id="sale-clock">HKT 23:59:50</span>

    </header>



    <main id="hkt-app" class="hkt-app"></main>



    <aside id="hud" class="hud">

      <p class="hud-kicker">TickPilot runtime</p>

      <strong id="hud-state">STANDBY</strong>

      <p id="hud-message">Local mirror — full automation in test arena only.</p>

      <ol id="hud-steps">

        <li data-step="login">Login</li>

        <li data-step="queue">Queue</li>

        <li data-step="selection">Select</li>

        <li data-step="form">Confirm</li>

        <li data-step="complete">Pay</li>

      </ol>

      <div class="hud-actions">

        <button id="hud-start" type="button">Start test</button>

        <button id="hud-stop" type="button" disabled>Stop</button>

      </div>

    </aside>



    <script src="lib/tickpilot-options.js"></script>

    <script>

      (function () {

        const params = new URLSearchParams(location.search);

        window.__TP_PLATFORM__ = params.get("platform") === "kktix" ? "kktix" : "hkt";

        if (window.__TP_PLATFORM__ === "kktix") {

          document.title = "KKTIX Mirror · TickPilot Arena";

          document.getElementById("mirror-brand").innerHTML = 'KKTIX <span>MIRROR</span>';

          document.getElementById("mirror-host").textContent = "kktix.com";

        }

      })();

    </script>

    <script src="lib/human-click.js"></script>

    <script src="hkt-shared.js"></script>

    <script src="app.js"></script>

    <script src="kktix-mirror.js"></script>

    <script src="settings-ui.js"></script>

    <script src="runner.js"></script>

  </body>

</html>
